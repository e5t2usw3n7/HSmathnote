# site
site_name: HS Math Notes

# repo
repo_url: "https://github.com/e5t2usw3n7/HSmathnote"

# content
nav:
  - 主页: index.md
  - 圆锥曲线:
    - 二级结论系列:
      - "结论1：焦点三角形面积公式": "圆锥曲线/1.md"
      - "结论2：“万能”公式": "圆锥曲线/2.md"
      - "结论3：中点弦斜率关系": "圆锥曲线/3.md"
      - "结论4：焦半径公式": "圆锥曲线/4.md"
      - "结论5：内准圆": "圆锥曲线/5.md"
      - "结论6：外准圆": "圆锥曲线/6.md"
      - "结论7：极点与极线": "圆锥曲线/7.md"
      - "结论8：双曲线上点到两渐近线距离之积": "圆锥曲线/8.md"
      - "结论9：伴侣点": "圆锥曲线/9.md"
      - "结论10：共焦点问题": "圆锥曲线/10.md"
      - "结论11: “一定两动，对称直线”": "圆锥曲线/11.md"
      - "结论12: “一定两动，垂直直线”": "圆锥曲线/12.md"
      - "结论13: 抛物线过焦点直线的坐标关系": "圆锥曲线/13.md"
    - 题型归纳系列:
      - "待办": "导数/no.md"

  - 导数:
    - "待办": "导数/no.md"

  - 向量:
    - "向量与三角形": "向量/Lecture1.md"

copyright: Copyright 2024 by e5t2usw3n7

theme:
  name: 'material'
  logo: 'img/miao.jpeg'
  favicon: 'img/miao.jpeg'
  palette:     #切换昼夜模式的颜色
    - media: "(prefers-color-scheme: light)" 
      scheme: 'default'  #浅色模式
      # 顶栏
      primary: 'black'
      # 强调色（交互）
      accent: 'indigo'  #强调色
      toggle:
        icon: material/weather-sunny #图标，太阳
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"  
      scheme: 'slate'  #深色模式
      primary: 'black'
      toggle:
        icon: material/weather-night #图标，月亮
        name: Switch to light mode
  font:
    text: JetBrains Mono, LXGW WenKai Mono GB Screen 
    code: JetBrains Mono
  features: 
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.footnote.tooltips
    - header.autohide
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - navigation.prune
    - search.share

markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition # 注解
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.superfences:
        # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: ⚓︎
      title: index
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

extra_javascript:
  - 'style/javascripts/mathjax.js'
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - 'style/css/img.css'
  - 'style/css/code.css'
  - 'style/css/table.css'
  - 'style/css/fonts.css'
  - 'style/css/mermaid.css'
plugins:
  - search
  - mermaid2



language:
  - 'zh'
  - 'en'